name: Daily DB Backup

on:
  schedule:
    - cron: '0 8 * * *'  # 00:00 LA time (UTC-8)
  workflow_dispatch:      # รันมือได้

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Backup Database
        env:
          PGPASSWORD: bEg9K1v1xtgGIcZeMrocDG2yklSKbOQE
        run: |
          DATE=$(date +%Y%m%d_%H%M%S)
          pg_dump -h dpg-d8dh52jbc2fs73ekhl30-a.oregon-postgres.render.com \
            -U billtable_user -d billtable -F p \
            -f backup_${DATE}.sql
          echo "Backup created: backup_${DATE}.sql"

      - name: Push to billtable-backups repo
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d_%H%M%S)
          git config --global user.email "billbebela@gmail.com"
          git config --global user.name "BillTable Backup"
          git clone https://${BACKUP_TOKEN}@github.com/IOOIIOU17/billtable-backups.git
          cp backup_*.sql billtable-backups/
          cd billtable-backups
          git add .
          git commit -m "backup: ${DATE}"
          git push
